<rml>
    <head>
      <link type="text/rcss" href="gui.css"/>
      <script src="gui.lua"></script>
    </head>

    <body data-model="globalData">
      <div id = "center" data-if="mode == 2">
        <p id = "title">Elementalworld</p>
        <button id = "btn" onclick="changeMenu(0) JoinGame(false)">Singleplayer</button>
        <button id = "btn" onclick="changeMenu(4)">Multiplayer</button>
      </div>

      <div id = "center" data-if="mode == 4">
        <p id = "title">Elementalworld</p>
        <input type="text" data-value="ip" id = "textBox" onselect="print('selected')"/>
        <input type="text" data-value="playerName" id = "textBox2"/>
        <button id = "btn" onclick="changeMenu(0) JoinGame(true)">Join</button>
      </div>
      
      <div data-if="mode == 0">
          <p1 id="debug_info"> FPS: {{FPS}} Frametime: {{FRAME_TIME}}</p1><br></br>
          <p2 id="debug_info"> X: {{posX}} Y: {{posY}} Z: {{posZ}}</p2><br></br>
          <p3 id="debug_info"> Pitch: {{pitch}} Yaw: {{yaw}} Roll: *</p3><br></br>
          <p4 id="debug_info"> ChunkX: {{chunkX}} ChunkY: {{chunkY}} ChunkZ: {{chunkZ}}</p4><br></br>
          <p5 id="debug_info"> Velocity X: * Y: * Z: *</p5><br></br>
          <p6 id="debug_info"> Time of day: *</p6><br></br>
          <p7 id="debug_info"> Number of lights: *</p7><br></br>
          <p8 id="debug_info"> Look at X: * Y:* Z:*</p8><br></br>

          <input type="text" data-value="chatArguments" id = "chatTextbox"/>

          <img src="../textures/misc/cursor.png" id="crosshair"/>
      </div>
    </body>
</rml>
