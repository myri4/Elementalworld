<rml>
    <head>
      <link type="text/rcss" href="test.css"/>
    </head>

    <body>
      <div id = "center" data-model="my_model" data-if="mode == 2">
        <p id = "title">Elementalworld</p>
        <button id = "btn" data-event-click="JoinSinglePlayer">Singleplayer</button>
        <button id = "btn" data-event-click="JoinMultiPlayerMenu">Multiplayer</button>
      </div>

      <div id = "center" data-model="my_model" data-if="mode == 4">
        <p class = "title">Elementalworld</p>
        <input type="text" data-value="ip" id = "textBox"/>
        <input type="text" data-value="playerName" id = "textBox2"/>
        <button id = "btn" on-click="JoinMultiPlayer">Join</button>
      </div>
    </body>
</rml>
